%% Copy beside ca.pem, node.pem and node.key. OTP reads this file at boot.
(fun() ->
    {ok, [[File]]} = init:get_argument(ssl_dist_optfile),
    Dir = filename:dirname(File),
    Peer = [{cacertfile, filename:join(Dir, "ca.pem")},
            {certfile, filename:join(Dir, "node.pem")},
            {keyfile, filename:join(Dir, "node.key")},
            {verify, verify_peer}],
    [{server, [{fail_if_no_peer_cert, true} | Peer]}, {client, Peer}]
end)().
